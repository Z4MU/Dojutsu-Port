plugins {
    id "architectury-plugin" version "3.4.164"
    id "dev.architectury.loom" version "1.7.435" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: "dev.architectury.loom"
    apply plugin: "architectury-plugin"

    base {
        // Cada subproyecto genera <archives_base_name>-<subproyecto>.jar (p. ej. dojutsu-fabric).
        archivesName = "$rootProject.archives_base_name-$project.name"
    }

    loom {
        // Los mappings oficiales de Mojang requieren aceptar su licencia; se silencia el aviso.
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:$rootProject.minecraft_version"
        // Mappings unificados (Mojmap) en los tres subproyectos: prohibido mezclar con Yarn (RM-6).
        mappings loom.officialMojangMappings()
    }

    java {
        withSourcesJar()
        // Fija la toolchain a Java 21: si el JDK no es 21 el build falla con mensaje claro (DJT-001 caso borde).
        toolchain.languageVersion = JavaLanguageVersion.of(rootProject.java_version as int)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = rootProject.java_version as int
    }
}
