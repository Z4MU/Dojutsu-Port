name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancela ejecuciones antiguas del mismo ref cuando llega una nueva.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permiso de ejecucion al wrapper
        run: chmod +x ./gradlew

      # Compila los 3 subprojects (common/neoforge/fabric) y ejecuta los tests.
      # 'build' ya depende de 'test'; se anade explicito para dejar clara la intencion.
      - name: Build & test
        run: ./gradlew build test --stacktrace
