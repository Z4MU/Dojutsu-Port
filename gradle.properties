# ---------------------------------------------------------------------------
# Dojutsu — propiedades de build (fuente única de versiones)
# DJT-001 · Estructura Gradle multiloader (Architectury)
# ---------------------------------------------------------------------------

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.daemon=true

# --- Metadatos del mod -----------------------------------------------------
mod_id=dojutsu
mod_name=Dojutsu
mod_version=0.1.0
mod_author=Zamu
mod_description=Sistema de habilidades ninja (Naruto/Boruto) para Minecraft.
maven_group=com.zamu.dojutsu
archives_base_name=dojutsu

# --- Plataforma ------------------------------------------------------------
# Loaders habilitados para el modulo common (Architectury).
enabled_platforms=fabric,neoforge

# --- Minecraft / Java ------------------------------------------------------
minecraft_version=1.21.1
java_version=21

# --- Dependencias (versiones conocidas-buenas para 1.21.1) -----------------
architectury_api_version=13.0.8
fabric_loader_version=0.16.10
fabric_api_version=0.116.13+1.21.1
neoforge_version=21.1.235

# --- Test (dominio, TDD desde F1) ------------------------------------------
junit_version=5.10.2
